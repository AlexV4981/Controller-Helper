[package]
name = "controller-studio"
version = "0.3.2"
edition = "2024"
license = "MIT"
description = "Offline controller detection, visual remapping and Nintendo emulator profiles"

[dependencies]
libloading = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
toml = "=1.1.2"

[profile.release]
strip = true
lto = "thin"

[patch.crates-io]
tiny_http = { path = "vendor/tiny_http" }
